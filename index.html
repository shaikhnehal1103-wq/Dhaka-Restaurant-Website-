<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhaka Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <img src="logo.png" alt="Foodwagon logo" class="logo">

        <p class="deliver-info">
            Deliver to: <i class="fa-solid fa-location-dot"></i>
            <strong>Mohammadpur Bus Stand, Dhaka</strong>
        </p>

        <div class="header-actions">
            <button><i class="fa-solid fa-magnifying-glass"></i> Search Food</button>
            <button><i class="fa-solid fa-user"></i> Login</button>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>Are you starving?</h1>
            <p>Within a few clicks, find meals that are accessible near you</p>

            <div class="order-box">
                <div class="tabs">
                    <button class="active"><i class="fa-solid fa-person-biking"></i> Delivery</button>
                    <button><i class="fa-solid fa-bag-shopping"></i> Pickup</button>
                </div>

                <div class="input-group">
                    <input type="text" placeholder="Enter Your Address">
                    <button><i class="fa-solid fa-magnifying-glass"></i> Find Food</button>
                </div>
            </div>
        </div>

        <img src="noodles.png" alt="Delicious noodles" class="hero-image">
    </section>

</body>
</html>
